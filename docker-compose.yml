services:
  postgres:
    image: postgres:16-alpine
    container_name: phantom-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phantom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phantom_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-phantom}
    ports:
      - "5432:5432"
    volumes:
      - phantom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phantom"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: phantom-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-phantom_neo4j_dev}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - phantom_neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: phantom-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  phantom_pgdata:
  phantom_neo4j_data:
